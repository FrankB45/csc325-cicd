name: frankApp CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.14
      uses: actions/setup-python@v4
      with:
        python-version: 3.14
  dependencies:
    runs-on: ubuntu-latest
    steps:
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Run Tests
      run: |
        python manage.py test frankApp --verbosity 2
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Deploy
      run: |
        echo "Deploying application..."

